name: Exposure
fileGroups:
  - Config/Subscriptions.storekit
options:
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en-AU
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
packages:
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios-spm.git
    exactVersion: 5.94.0
  ExposureCore:
    path: .
targets:
  Exposure:
    type: application
    platform: iOS
    sources:
      - Exposure/App
      - Exposure/Features
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_IDENTIFIER)
        GENERATE_INFOPLIST_FILE: NO
        SUPPORTS_MACCATALYST: NO
      configs:
        Debug:
          INFOPLIST_FILE: Config/Info-Debug.plist
        Release:
          INFOPLIST_FILE: Config/Info-Release.plist
    dependencies:
      - package: ExposureCore
      - package: RevenueCat
        product: RevenueCat
      - package: RevenueCat
        product: RevenueCatUI
  ExposureTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - ExposureTests
      - path: Config/Subscriptions.storekit
        buildPhase: resources
    dependencies:
      - target: Exposure
      - package: ExposureCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.cybrguard.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Exposure:
    build:
      targets:
        Exposure: all
        ExposureTests: [test]
    test:
      targets:
        - ExposureTests
      gatherCoverageData: true
